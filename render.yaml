databases:
  - name: vayro-db
    plan: free
    databaseName: vayro
    user: vayro
services:
  - type: web
    name: vayro
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build -- --webpack
    # Neon pooled URLs can time out on Prisma's advisory lock during a
    # Render restart. The wrapper retries migrations and then starts Next.js.
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase: { name: vayro-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      # Optional production integrations. Leave unset until real provider
      # credentials and products are configured; Vayro never simulates them.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_CONNECT_CLIENT_ID
        sync: false
      - key: STRIPE_PLUS_WEEKLY_PRICE_ID
        sync: false
      - key: STRIPE_PLUS_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PLUS_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SUPPORT_EMAIL
        value: d.c.hurst21@gmail.com
      - key: NEXT_PUBLIC_ADSENSE_PUBLISHER_ID
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_SLOT_ID
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: IDENTITY_PROVIDER_API_KEY
        sync: false
